name: neolearn
description: "NeoLearn - Aplikasi Toko Buku & Perlengkapan Belajar (Flutter + GetX + XAMPP)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  http: ^1.4.0
  intl: ^0.20.2
  fl_chart: ^1.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  # image 4.11.x memanggil ZLibDecoder.decodeLazy yang belum ada di archive versi
  # yang kompatibel dengan Dart 3.11 -> compile error pada package pdf. Wajib dibatasi.
  image: ">=4.5.0 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/launcher_icon.png"
  adaptive_icon_background: "#EAF4FB"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  min_sdk_android: 21
